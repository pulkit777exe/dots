# Theme colors — generated by quickshell/scripts/publish-colors.py from
# the active theme (colors/index.json) and kept in sync at
# ~/.config/kitty/current-theme.conf on every theme change. Included
# here so a freshly-opened kitty window (or one after a reboot) picks
# up the current theme immediately, without waiting for a live
# `kitty @ set-colors` call.
include current-theme.conf

# Remote control — required for publish-colors.py's live apply_live()
# step (`kitty @ set-colors --all --configured ...`) to reach already-
# open windows the instant a theme is switched, instead of only new
# ones picking up the `include` above.
allow_remote_control yes
listen_on unix:/tmp/kitty-{kitty_pid}

background_opacity 0.82
dynamic_background_opacity yes

hide_window_decorations yes

enable_audio_bell no
visual_bell_duration 0

scrollback_lines 10000

mouse_hide_wait 3.0

cursor_trail 3
