# The terminal is deliberately left on kitty's own defaults.
#
# It used to `include current-theme.conf`, which repainted the whole
# palette including `background`, and it also set background_opacity with
# dynamic_background_opacity so the desktop wallpaper showed through. Both
# are gone: the terminal keeps its stock background and stays opaque.
#
# The theme still drives the compositor, the shell, GTK apps and the CSS
# variables — just not the terminal. publish-colors.py no longer writes
# current-theme.conf or pushes `kitty @ set-colors`, so switching themes
# cannot quietly re-apply it.
#
# current-theme.conf is kept in the repo only as a record of the last
# generated palette; nothing includes it.

allow_remote_control yes
listen_on unix:/tmp/kitty-{kitty_pid}

hide_window_decorations yes

enable_audio_bell no
visual_bell_duration 0

scrollback_lines 10000

mouse_hide_wait 3.0

cursor_trail 3
