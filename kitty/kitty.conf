# The palette lives at ../colors/kitty.conf (rewritten by every
# publish-colors.py run) and is included below; open terminals are
# repainted live over the remote-control socket. Opacity stays at its
# default: the wallpaper does not show through.

allow_remote_control yes
listen_on unix:/tmp/kitty-{kitty_pid}

include ../colors/kitty.conf

hide_window_decorations yes

enable_audio_bell no
visual_bell_duration 0

scrollback_lines 10000

mouse_hide_wait 3.0

cursor_trail 3
