# Themed from the generated palette: ../colors/kitty.conf ships with every
# publish-colors.py run and is included below, and the script repaints
# already-open terminals live over the remote-control socket. The old
# "deliberately stock" era is gone — the terminal is part of the themed
# desktop. (Opacity stays at its default: the wallpaper does not show
# through.)

allow_remote_control yes
listen_on unix:/tmp/kitty-{kitty_pid}

include ../colors/kitty.conf

hide_window_decorations yes

enable_audio_bell no
visual_bell_duration 0

scrollback_lines 10000

mouse_hide_wait 3.0

cursor_trail 3
