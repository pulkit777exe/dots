# Source this from your main hyprland.conf:
#   source = ~/.config/hypr/hypr-island/config/hyprland-island.conf
#
# Launches the Island shell and wires the confirmed keybinds:
#   Super+Space -> expanded (Control Center) -- also the no-mouse fallback
#                  for hover-intent
#   Alt+Space   -> launcher (top-level, independent of Control Center)
#   Super+T     -> theme picker, direct entry
#   Super+W     -> wallpaper picker, direct entry
#   Super+S     -> settings, direct entry (bar height/font size/theme/wallpaper nav)
#   Super+P     -> power menu, direct entry (lock/suspend/logout/reboot/poweroff)
#
# Each keybind calls a small dispatch script rather than hyprctl directly,
# so the actual IPC mechanism (socket, D-Bus, whatever Quickshell exposes in
# your installed version) is isolated to one place -- see
# scripts/island-dispatch.sh.

exec-once = bash -c 'pgrep -f "qs -c $HOME/.config/quickshell/shell.qml" >/dev/null || qs -c ~/.config/quickshell/shell.qml'

bind = SUPER, space, exec, ~/.config/quickshell/scripts/island-dispatch.sh expanded
bind = ALT, space, exec, ~/.config/quickshell/scripts/island-dispatch.sh launcher
bind = SUPER, T, exec, ~/.config/quickshell/scripts/island-dispatch.sh theme
bind = SUPER, W, exec, ~/.config/quickshell/scripts/island-dispatch.sh wallpaper
bind = SUPER, S, exec, ~/.config/quickshell/scripts/island-dispatch.sh settings
bind = SUPER, P, exec, ~/.config/quickshell/scripts/island-dispatch.sh power

# Safe mode: kill quickshell and relaunch it fresh (escape hatch if Island
# crashes/hangs). Deliberately does NOT go through `hyprctl reload` -- that
# only re-sources hyprland.conf, and exec-once entries don't re-fire on
# reload, so the old version of this bind killed quickshell and never
# actually brought it back.
bind = SUPER, ESC, exec, pkill -x qs; qs -c ~/.config/quickshell/shell.qml &
