[General]
# Wallpaper shown behind the login. Relative to the theme dir, or absolute.
background=wallpaper.jpg
# Preferred UI font. Falls back through fontconfig when missing in the greeter.
fontFamily=SF Pro Display
# Clock format for the menu bar (Qt.time format string).
timeFormat=HH:mm
# Dim the wallpaper slightly (0.0 - 1.0) so white text stays readable.
dimOverlay=0.12
